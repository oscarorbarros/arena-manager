<!DOCTYPE html>
<html>
<head>
    <title>Debug localStorage</title>
</head>
<body style="background: #1a1a1a; color: white; font-family: monospace; padding: 20px;">
    <h1>Debug localStorage - Arena Manager</h1>
    <button onclick="checkStorage()" style="padding: 10px 20px; margin: 10px 0; cursor: pointer;">
        Verificar localStorage
    </button>
    <button onclick="clearStorage()" style="padding: 10px 20px; margin: 10px 0; cursor: pointer; background: red; color: white; border: none;">
        Limpar localStorage
    </button>
    <pre id="output" style="background: #2a2a2a; padding: 20px; border-radius: 8px; margin-top: 20px;"></pre>
    
    <script>
        function checkStorage() {
            const output = document.getElementById('output');
            const user = localStorage.getItem('arena_user');
            
            let result = '=== localStorage Debug ===\n\n';
            
            if (user) {
                result += 'arena_user RAW:\n' + user + '\n\n';
                try {
                    const parsed = JSON.parse(user);
                    result += 'arena_user PARSED:\n' + JSON.stringify(parsed, null, 2) + '\n\n';
                    result += 'User Name: ' + parsed.name + '\n';
                    result += 'User Role: ' + parsed.role + '\n';
                    result += 'User Email: ' + parsed.email + '\n';
                    result += 'User ID: ' + parsed.id + '\n';
                } catch (e) {
                    result += 'ERRO ao fazer parse: ' + e.message;
                }
            } else {
                result += 'NENHUM usuario encontrado no localStorage!\n';
                result += 'Voce precisa fazer login primeiro.';
            }
            
            output.textContent = result;
        }
        
        function clearStorage() {
            localStorage.removeItem('arena_user');
            alert('localStorage limpo! Faca login novamente.');
            checkStorage();
        }
        
        checkStorage();
    </script>
</body>
</html>
